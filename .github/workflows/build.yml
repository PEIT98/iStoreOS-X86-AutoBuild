name: Build iStoreOS 25.12 x86_64

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: 'Publish firmware to GitHub Releases'
        required: true
        default: true
        type: boolean
  push:
    branches: [main]
    paths:
      - '.github/workflows/build.yml'
      - 'configs/**'
      - 'scripts/**'
  schedule:
    - cron: '0 20 * * 6' # Sunday 04:00 Asia/Shanghai

permissions:
  contents: write

concurrency:
  group: istoreos-x86-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout build configuration
        uses: actions/checkout@v4

      - name: Free runner disk space
        run: |
          set -euo pipefail
          df -h .
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/hostedtoolcache/CodeQL /usr/local/share/powershell /usr/share/swift || true
          sudo apt-get clean
          df -h .

      - name: Install build prerequisites
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
            gettext git libncurses-dev libssl-dev python3 python3-setuptools \
            python3-venv python3-pyelftools rsync unzip zlib1g-dev file wget \
            curl jq ca-certificates libelf-dev liblzma-dev zstd xz-utils \
            squashfs-tools ccache help2man cmake ninja-build pkgconf \
            libxml2-utils xmlto xsltproc zip

      - name: Install Rust for QModem
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl

      - name: Clone official iStoreOS 25.12
        run: |
          set -euo pipefail
          git clone --depth=1 --single-branch --branch istoreos-25.12 \
            https://github.com/istoreos/istoreos.git openwrt

      - name: Prepare feeds and firmware configuration
        run: bash scripts/prepare.sh openwrt

      - name: Download package sources
        working-directory: openwrt
        run: make -j2 download V=s

      - name: Build x86_64 firmware
        working-directory: openwrt
        run: |
          set -euo pipefail
          if ! make -j2 V=s; then
            echo 'Parallel build failed; retry serially for diagnostics.' >&2
            make -j1 V=s
          fi

      - name: Collect firmware files
        run: bash scripts/collect.sh openwrt release

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: istoreos-25.12-x86-64
          path: release/
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        if: github.event_name != 'workflow_dispatch' || inputs.publish_release == true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: autobuild-25.12-${{ github.run_id }}
          name: iStoreOS 25.12 x86_64 run ${{ github.run_number }}
          body: |
            iStoreOS 25.12 x86_64 custom firmware with QModem Next and Wi-Fi/Ethernet drivers.
            See build-info.txt for exact iStoreOS and QModem revisions.
            Back up configuration and disk data before flashing.
          files: release/*
          fail_on_unmatched_files: true
